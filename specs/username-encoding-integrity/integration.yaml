contract:
  api_or_event_changes: >-
    POST /chat/stream keeps senderName and senderType as deprecated compatibility
    inputs but ignores them; HTTP, advisor, relay, persistence, metadata and Agent
    WebSocket sender identity are server-authoritative.
  compatibility: >-
    Existing clients remain accepted. New Web clients stop sending sender identity.
    Historical names receive display-only fallback until authorized data repair.
  data_migration: >-
    No DDL is assumed. Any MySQL, LDAP or chat-history write requires a separate
    read-only audit, a SHA-256-bound manifest, compare-and-set, readback and explicit
    production-write authorization.
  security: >-
    Human identity resolves from EsContext jiacn/clientId plus UserService; Agent
    identity resolves from the authenticated session agentId plus runtime/persona.
