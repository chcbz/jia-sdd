name: cyf-output-scanner-network-plan
sources: {}
stages:
  host_preflight:
    name: Read-only output deployment prerequisites
    jobs:
      inspect_host:
        name: Pinned scanner dependency plan in bounded private cache
        component: VMDeploy
        with:
          downloadArtifact: false
          executeUser: root
          run: "set -eu\n/usr/bin/python3 -I -S - <<'CYF_OUTPUT_SCANNER_PLAN_PY'\n#!/usr/bin/env python3\n\"\"\"\
            Resolve three approved distro caches in a private capped mount namespace; no RPM install.\"\"\"\nimport\
            \ configparser\nimport contextlib\nimport ctypes\nimport glob\nimport hashlib\nimport json\nimport os\n\
            from pathlib import Path\nimport re\nimport selectors\nimport signal\nimport stat\nimport subprocess\n\
            import sys\nimport tempfile\nimport time\nfrom urllib.parse import urlsplit\n\nREPOS = ('alinux3-os',\
            \ 'alinux3-updates', 'epel')\nHOSTS = ('mirrors.cloud.aliyuncs.com', 'mirrors.aliyun.com')\nENV = {'PATH':\
            \ '/usr/sbin:/usr/bin:/sbin:/bin', 'HOME': '/root', 'LC_ALL': 'C', 'LANG': 'C'}\n\n\ndef read_trusted(path,\
            \ limit):\n    fd = os.open(str(path), os.O_RDONLY | os.O_NOFOLLOW)\n    with os.fdopen(fd, 'rb') as\
            \ f:\n        st = os.fstat(f.fileno())\n        if not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or\
            \ st.st_mode & 0o022:\n            raise ValueError('file_identity')\n        data = f.read(limit+1)\n\
            \    if len(data) > limit:\n        raise ValueError('file_size')\n    return data\n\n\ndef approved_repos():\n\
            \    # Public vendor endpoints observed from this development host; no host repo config is read.\n \
            \   os_path = os.path.realpath('/etc/os-release')\n    if os_path not in ('/etc/os-release', '/usr/lib/os-release'):\n\
            \        raise ValueError('os_release_path')\n    os_release = read_trusted(os_path, 8192).decode()\n\
            \    values = dict(line.split('=', 1) for line in os_release.splitlines() if '=' in line and not line.startswith('#'))\n\
            \    if values.get('ID', '').strip('\"') != 'alinux' or values.get('VERSION_ID', '').strip('\"') !=\
            \ '3' or os.uname().machine != 'x86_64':\n        raise ValueError('distribution_identity')\n    return\
            \ {\n        'alinux3-os': {'baseurl': 'https://mirrors.aliyun.com/alinux/3/os/x86_64/', 'host': 'mirrors.aliyun.com'},\n\
            \        'alinux3-updates': {'baseurl': 'https://mirrors.aliyun.com/alinux/3/updates/x86_64/', 'host':\
            \ 'mirrors.aliyun.com'},\n        'epel': {'baseurl': 'https://mirrors.aliyun.com/epel/8/Everything/x86_64/',\
            \ 'host': 'mirrors.aliyun.com'},\n    }\n\n\n@contextlib.contextmanager\ndef capped_workspace():\n \
            \   libc = ctypes.CDLL(None, use_errno=True)\n    libc.mount.argtypes = [ctypes.c_char_p, ctypes.c_char_p,\
            \ ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p]\n    libc.umount2.argtypes = [ctypes.c_char_p, ctypes.c_int]\n\
            \    if libc.unshare(0x00020000) != 0: # CLONE_NEWNS\n        raise ValueError('mount_namespace_unavailable')\n\
            \    if libc.mount(None, b'/', None, (1 << 18) | 16384, None) != 0: # MS_PRIVATE | MS_REC\n        raise\
            \ ValueError('mount_namespace_not_private')\n    with tempfile.TemporaryDirectory(prefix='cyf-scanner-plan-',\
            \ dir='/var/tmp') as temp:\n        target = os.fsencode(temp)\n        if libc.mount(b'tmpfs', target,\
            \ b'tmpfs', 2 | 4 | 8, b'size=256m,mode=0700') != 0:\n            raise ValueError('bounded_tmpfs_unavailable')\n\
            \        try:\n            yield Path(temp)\n        finally:\n            if libc.umount2(target, 0)\
            \ != 0:\n                raise ValueError('bounded_tmpfs_cleanup_failed')\n\n\ndef run(command):\n \
            \   p = subprocess.Popen(command, env=ENV, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,\n     \
            \                    stderr=subprocess.STDOUT, start_new_session=True)\n    selector = selectors.DefaultSelector()\n\
            \    selector.register(p.stdout, selectors.EVENT_READ)\n    result = bytearray()\n    deadline = time.monotonic()+120\n\
            \    try:\n        while selector.get_map():\n            if time.monotonic() >= deadline:\n       \
            \         raise ValueError('dnf_timeout')\n            for key, _ in selector.select(0.2):\n       \
            \         data = os.read(key.fileobj.fileno(), 65536)\n                if not data:\n              \
            \      selector.unregister(key.fileobj)\n                    continue\n                if len(result)+len(data)\
            \ > 2*1024**2:\n                    raise ValueError('dnf_output_limit')\n                result.extend(data)\n\
            \        p.wait(timeout=max(0.01, deadline-time.monotonic()))\n        return p.returncode, result.decode('utf-8',\
            \ errors='replace')\n    finally:\n        try:\n            os.killpg(p.pid, signal.SIGKILL)\n    \
            \    except ProcessLookupError:\n            pass\n        p.wait(timeout=10)\n        selector.close()\n\
            \        p.stdout.close()\n\n\ndef parse(code, raw):\n    rows = []\n    pending = ''\n    in_table\
            \ = False\n    finished = False\n    bad = False\n    aborted = 0\n    seen = set()\n    for line in\
            \ raw.splitlines():\n        line = line.strip()\n        if line == 'Operation aborted.':\n       \
            \     aborted += 1\n        if re.search(r'(?i)(error:|failed|no match for argument|cannot |could not\
            \ |unable to|problem:|ignoring repositories|skip.*repositor)', line):\n            bad = True\n    \
            \    if line in ('Installing:', 'Installing dependencies:'):\n            bad |= bool(pending)\n   \
            \         in_table = True\n            continue\n        if line == 'Transaction Summary':\n       \
            \     bad |= bool(pending) or not in_table\n            in_table = False\n            finished = True\n\
            \            continue\n        if in_table:\n            if not line or re.fullmatch(r'=+', line):\n\
            \                continue\n            pending = (pending+' '+line).strip()\n            parts = pending.split()\n\
            \            if len(parts)<6 and len(pending)<500:\n                continue\n            if (len(parts)==6\
            \ and re.fullmatch(r'[A-Za-z0-9_.+-]{1,100}',parts[0])\n                    and parts[1] in ('x86_64','noarch')\
            \ and re.fullmatch(r'[A-Za-z0-9:_.+~^-]{1,100}',parts[2])\n                    and parts[3] in REPOS\
            \ and re.fullmatch(r'[0-9.]+',parts[4]) and parts[5] in ('k','M','G','T')\n                    and tuple(parts[:4])\
            \ not in seen and len(seen)<256):\n                seen.add(tuple(parts[:4]))\n                rows.append(dict(zip(('name','arch','version','repository'),parts[:4])))\n\
            \            else:\n                bad = True\n            pending = ''\n    complete = ({'clamav','clamd','clamav-freshclam'}.issubset({r['name']\
            \ for r in rows})\n                and code==1 and aborted==1 and finished and not (bad or pending or\
            \ in_table))\n    return {'status': 'complete_network_plan' if complete else 'UNKNOWN', 'packages':\
            \ rows,\n            'dnfExitCode':code,'automaticRefusalCount':aborted,'parseProblem':bool(bad or pending\
            \ or in_table)}\n\n\ndef main():\n    out = {'observedAtEpoch':int(time.time()),'status':'UNKNOWN','packageInstallRequested':False,\n\
            \           'cacheLimitBytes':256*1024**2,'privateMountNamespaceRequested':True}\n    phase = 'preflight'\n\
            \    try:\n        if os.geteuid()!=0:\n            raise ValueError('root_required')\n        st=os.statvfs('/var/tmp');out['diskAvailableBefore']=st.f_bavail*st.f_frsize\n\
            \        memory=dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())\n\
            \        out['memAvailableBefore']=int(memory['MemAvailable'].split()[0])*1024\n        if out['diskAvailableBefore']<4*1024**3\
            \ or out['memAvailableBefore']<1536*1024**2:\n            raise ValueError('resource_gate')\n      \
            \  repos=approved_repos()\n        out['repositories']=[{'id':rid,'scheme':'https','host':repos[rid]['host']}\
            \ for rid in REPOS]\n        phase='bounded_metadata_plan'\n        with capped_workspace() as temp:\n\
            \            out['privateMountNamespaceCreated'] = True\n            repo_dir=temp/'repos';repo_dir.mkdir()\n\
            \            text=''.join('['+rid+']\\nname='+rid+'\\nbaseurl='+repos[rid]['baseurl']+'\\nenabled=1\\\
            ngpgcheck=1\\nsslverify=1\\nskip_if_unavailable=False\\n\\n' for rid in REPOS)\n            (repo_dir/'approved.repo').write_text(text)\n\
            \            config=temp/'dnf.conf'\n            config.write_text('[main]\\nplugins=0\\nreposdir='+str(repo_dir)+'\\\
            ncachedir='+str(temp/'cache')+'\\nsystem_cachedir='+str(temp/'cache')+'\\nlogdir='+str(temp/'logs')+'\\\
            npersistdir='+str(temp/'state')+'\\nvarsdir='+str(temp/'vars')+'\\ninstall_weak_deps=False\\ngpgcheck=1\\\
            nsslverify=1\\nskip_if_unavailable=False\\nlog_size=1048576\\nlog_rotate=0\\n')\n            command=['/usr/bin/dnf','--config='+str(config),'--noplugins','--assumeno','--disablerepo=*']+['--enablerepo='+x\
            \ for x in REPOS]+['--setopt=timeout=15','--setopt=retries=0','install','clamav-1.4.6-1.el8.x86_64','clamd-1.4.6-1.el8.x86_64','clamav-freshclam-1.4.6-1.el8.x86_64']\n\
            \            code,raw=run(command)\n            out.update(parse(code,raw))\n            out['rpmDownloaded']=any(temp.rglob('*.rpm'))\n\
            \            cache=os.statvfs(temp);out['temporaryUsedBytes']=(cache.f_blocks-cache.f_bfree)*cache.f_frsize\n\
            \            if out['rpmDownloaded']:\n                out['status']='UNKNOWN'\n        out['privateMountRemoved']=True\n\
            \    except (OSError,ValueError,KeyError,configparser.Error,subprocess.SubprocessError):\n        out.update(status='UNKNOWN',failedPhase=phase)\n\
            \    finally:\n        st=os.statvfs('/var/tmp');out['diskAvailableAfter']=st.f_bavail*st.f_frsize\n\
            \        if out.get('diskAvailableBefore',0)-out['diskAvailableAfter']>16*1024**2:\n            out.update(status='UNKNOWN',diskDriftExceeded=True)\n\
            \    print(json.dumps(out,sort_keys=True))\n    return 0 if out['status']=='complete_network_plan' else\
            \ 1\n\n\nif __name__=='__main__':\n    raise SystemExit(main())\nCYF_OUTPUT_SCANNER_PLAN_PY\n"
          useEncodeBase64: false
          machineGroup: yjctjhskhk1ti9t4
          batchNumber: 1
          batchWaitTime: 0
          deployTimeoutPerHost: 300
