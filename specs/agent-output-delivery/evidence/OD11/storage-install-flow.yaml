name: cyf-output-storage-install
sources: {}
stages:
  host_preflight:
    name: Install isolated Agent output storage
    jobs:
      inspect_host:
        name: Pinned MinIO private service; no API restart
        component: VMDeploy
        with:
          downloadArtifact: false
          executeUser: root
          run: "set -eu\n/usr/bin/python3 -I -S - <<'CYF_OUTPUT_STORAGE_INSTALL_PY'\n#!/usr/bin/env python3\n\"\"\
            \"Install a pinned MinIO in new task-specific paths; never touches an existing API runtime.\"\"\"\n\
            import hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport pwd\nimport secrets\nimport\
            \ shutil\nimport socket\nimport stat\nimport subprocess\nimport tarfile\nimport tempfile\nimport time\n\
            import urllib.request\n\nBASE = Path('/opt/cyf/output-storage')\nCONFIG = Path('/etc/cyf-output-storage')\n\
            STATE = Path('/var/lib/cyf-output-storage')\nUNIT = Path('/etc/systemd/system/cyf-output-storage.service')\n\
            USER = 'cyf-output-store'\nLAYER = 'f9c0805c25ee5c0d375a9c16810eafb57cf658d7b6814c179d52496272bec8a4'\n\
            BINARY = '7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f'\nENV = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin',\
            \ 'HOME': '/root', 'LC_ALL': 'C', 'LANG': 'C'}\n\n\ndef run(args, timeout=30):\n    p = subprocess.run(args,\
            \ env=ENV, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,\n                       stderr=subprocess.DEVNULL,\
            \ timeout=timeout, check=False)\n    if p.returncode != 0:\n        raise RuntimeError('command_failed')\n\
            \n\ndef exclusive(path, data, mode=0o600):\n    fd = os.open(str(path), os.O_WRONLY | os.O_CREAT | os.O_EXCL\
            \ | os.O_NOFOLLOW, mode)\n    with os.fdopen(fd, 'wb') as f:\n        f.write(data)\n        f.flush()\n\
            \        os.fsync(f.fileno())\n\n\ndef main():\n    result = {'startedAtEpoch': int(time.time()), 'status':\
            \ 'UNKNOWN', 'apiRestartRequested': False}\n    phase = 'preflight'\n    try:\n        if os.geteuid()\
            \ != 0 or os.uname().machine != 'x86_64':\n            raise RuntimeError('host_identity_gate')\n  \
            \      for p in [BASE, CONFIG, STATE, UNIT]:\n            if os.path.lexists(p):\n                raise\
            \ RuntimeError('existing_task_path')\n        try:\n            pwd.getpwnam(USER)\n        except KeyError:\n\
            \            pass\n        else:\n            raise RuntimeError('existing_task_user')\n        for\
            \ ancestor in [Path('/opt'), Path('/opt/cyf'), Path('/etc'), Path('/var'), Path('/var/lib'), UNIT.parent]:\n\
            \            info = ancestor.lstat()\n            if not stat.S_ISDIR(info.st_mode) or info.st_uid !=\
            \ 0 or stat.S_IMODE(info.st_mode) & 0o022:\n                raise RuntimeError('untrusted_parent')\n\
            \        result['diskAvailableBefore'] = shutil.disk_usage('/opt').free\n        mem = dict(line.split(':',\
            \ 1) for line in Path('/proc/meminfo').read_text().splitlines())\n        result['memAvailableBefore']\
            \ = int(mem['MemAvailable'].split()[0]) * 1024\n        if result['diskAvailableBefore'] < 4 * 1024**3\
            \ or result['memAvailableBefore'] < 1536 * 1024**2:\n            raise RuntimeError('resource_gate')\n\
            \        for port in [19000, 19001]:\n            with socket.socket() as s:\n                s.bind(('127.0.0.1',\
            \ port))\n        phase = 'download_pinned_layer'\n        with tempfile.TemporaryDirectory(prefix='cyf-output-storage-install-',\
            \ dir='/opt/cyf') as temp:\n            layer_path = Path(temp) / 'layer.tar.gz'\n            url =\
            \ 'https://quay.io/v2/minio/minio/blobs/sha256:' + LAYER\n            # Public immutable layer; no registry/Flow\
            \ credentials or proxy inherited.\n            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
            \            digest = hashlib.sha256()\n            size = 0\n            with opener.open(url, timeout=30)\
            \ as response, layer_path.open('xb') as f:\n                deadline = time.monotonic()+120\n      \
            \          while True:\n                    if time.monotonic() > deadline:\n                      \
            \  raise RuntimeError('download_timeout')\n                    data = response.read(1024*1024)\n   \
            \                 if not data:\n                        break\n                    size += len(data)\n\
            \                    if size > 39450432:\n                        raise RuntimeError('layer_size_exceeded')\n\
            \                    digest.update(data)\n                    f.write(data)\n            if size !=\
            \ 39450432 or digest.hexdigest() != LAYER:\n                raise RuntimeError('layer_integrity')\n\
            \            candidate = Path(temp) / 'minio'\n            matches = 0\n            with tarfile.open(layer_path,\
            \ 'r|gz') as archive:\n                for member in archive:\n                    if member.name.lstrip('./')\
            \ != 'usr/bin/minio':\n                        continue\n                    matches += 1\n        \
            \            if matches != 1 or not member.isfile() or member.size != 110989496:\n                 \
            \       raise RuntimeError('binary_member_integrity')\n                    digest = hashlib.sha256()\n\
            \                    with archive.extractfile(member) as src, candidate.open('xb') as dst:\n       \
            \                 while True:\n                            data = src.read(1024*1024)\n            \
            \                if not data:\n                                break\n                            digest.update(data)\n\
            \                            dst.write(data)\n                    if digest.hexdigest() != BINARY:\n\
            \                        raise RuntimeError('binary_integrity')\n            if matches != 1:\n    \
            \            raise RuntimeError('binary_not_unique')\n            phase = 'install_new_paths'\n    \
            \        BASE.mkdir(mode=0o755)\n            CONFIG.mkdir(mode=0o700)\n            STATE.mkdir(mode=0o750)\n\
            \            receipt = BASE / 'install-intent.json'\n            exclusive(receipt, (json.dumps(dict(result,\
            \ layerSha256=LAYER, binarySha256=BINARY))+'\\n').encode())\n            run(['/usr/sbin/useradd', '--system',\
            \ '--user-group', '--no-create-home', '--home-dir', str(STATE), '--shell', '/sbin/nologin', USER])\n\
            \            user = pwd.getpwnam(USER)\n            os.chown(STATE, user.pw_uid, user.pw_gid)\n    \
            \        shutil.copyfile(candidate, BASE/'minio')\n            os.chmod(BASE/'minio', 0o755)\n     \
            \       credential = {'accessKey': 'cyf-output-'+secrets.token_hex(8), 'secretKey': secrets.token_hex(32)}\n\
            \            exclusive(CONFIG/'credentials.json', (json.dumps(credential)+'\\n').encode())\n       \
            \     exclusive(CONFIG/'minio.env', ('MINIO_ROOT_USER='+credential['accessKey']+'\\nMINIO_ROOT_PASSWORD='+credential['secretKey']+'\\\
            nMINIO_BROWSER=off\\nMINIO_API_REQUESTS_MAX=8\\nGOMEMLIMIT=256MiB\\n').encode())\n            unit =\
            \ '''[Unit]\nDescription=CYF Agent output object storage\nAfter=network-online.target\nWants=network-online.target\n\
            StartLimitIntervalSec=300\nStartLimitBurst=3\n\n[Service]\nUser=cyf-output-store\nGroup=cyf-output-store\n\
            EnvironmentFile=/etc/cyf-output-storage/minio.env\nExecStart=/opt/cyf/output-storage/minio server /var/lib/cyf-output-storage\
            \ --address 127.0.0.1:19000 --console-address 127.0.0.1:19001\nRestart=on-failure\nRestartSec=10\nUMask=0077\n\
            LimitNOFILE=4096\nMemoryMax=384M\nTasksMax=128\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\n\
            ProtectHome=true\nReadWritePaths=/var/lib/cyf-output-storage\nRestrictAddressFamilies=AF_INET AF_INET6\
            \ AF_UNIX\n\n[Install]\nWantedBy=multi-user.target\n'''\n            exclusive(UNIT, unit.encode(),\
            \ 0o644)\n        phase = 'activate_new_service'\n        run(['/usr/bin/systemctl', 'daemon-reload'])\n\
            \        run(['/usr/bin/systemctl', 'enable', '--now', 'cyf-output-storage.service'], timeout=60)\n\
            \        phase = 'readiness'\n        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
            \        ready = False\n        for _ in range(20):\n            try:\n                with opener.open('http://127.0.0.1:19000/minio/health/ready',\
            \ timeout=3) as response:\n                    ready = response.status == 200\n            except OSError:\n\
            \                pass\n            if ready:\n                break\n            time.sleep(1)\n   \
            \     if not ready:\n            raise RuntimeError('readiness_failed')\n        result.update(status='STORAGE_SERVICE_INSTALLED',\
            \ binarySha256=BINARY,\n                      service='cyf-output-storage.service', endpoint='http://127.0.0.1:19000',\n\
            \                      bucketCreated=False, applicationConfigured=False)\n        exclusive(BASE/'install-result.json',\
            \ (json.dumps(result,sort_keys=True)+'\\n').encode())\n    except (OSError, RuntimeError, subprocess.SubprocessError,\
            \ tarfile.TarError):\n        result.update(status='UNKNOWN', failedPhase=phase)\n    result['diskAvailableAfter']\
            \ = shutil.disk_usage('/opt').free\n    print(json.dumps(result, sort_keys=True))\n    return 0 if result['status']\
            \ == 'STORAGE_SERVICE_INSTALLED' else 1\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\n\
            CYF_OUTPUT_STORAGE_INSTALL_PY\n"
          useEncodeBase64: false
          machineGroup: yjctjhskhk1ti9t4
          batchNumber: 1
          batchWaitTime: 0
          deployTimeoutPerHost: 300
