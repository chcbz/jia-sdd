  /agent/tasks/{taskId}/deliveries/{deliveryId}/rework:
    post:
      operationId: dispatchRework
      x-release: R2
      security:
      - UserJwt: []
      description: Explicit owner action after CHANGES_REQUESTED; atomically queues
        one command. Max 3 review revisions, respect execution attempt cap.
      parameters:
      - name: taskId
        in: path
        required: true
        schema: *id012
      - name: deliveryId
        in: path
        required: true
        schema: *id012
      - name: Idempotency-Key
        in: header
        required: true
        schema:
