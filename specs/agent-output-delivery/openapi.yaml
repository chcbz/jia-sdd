  /agent/output-uploads/{uploadId}/content:
    put:
      operationId: putUploadBytes
      x-release: R1
      security:
      - RunTicket: []
      description: Writer epoch fencing; whole-file retry; no business idempotency
        header.
      parameters:
      - name: uploadId
        in: path
        required: true
        schema: &id012
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S+$
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '413': *id007
        '415': *id008
        '422': *id009
        '429': *id010
        '503': *id011
        '200':
          description: Success or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /agent/output-uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      x-release: R1
      security:
      - RunTicket: []
      description: ''
      parameters:
      - name: uploadId
        in: path
        required: true
        schema: *id012
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 100
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '413': *id007
        '415': *id008
        '422': *id009
        '429': *id010
        '503': *id011
        '200':
          description: Success or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '202':
          description: Verification pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
  /agent/output-uploads/{uploadId}:
    get:
      operationId: getUpload
      x-release: R1
