  /agent/tasks/{taskId}/work-items/{workItemId}/lease/{action}:
    post:
      operationId: mutateWorkLease
      x-release: R2
      security: &id014
      - RunTicket: []
      description: claim requires duration; start/heartbeat/release require leaseToken;
        heartbeat requires duration. Identity from run ticket. Response matches existing
        lease service. Invalid missing action-specific fields return 400. R1/R2 release
        receipts may carry failed status when attempts exhausted.
      parameters:
      - &id015
        name: taskId
        in: path
        required: true
        schema: *id012
      - &id016
        name: workItemId
        in: path
        required: true
        schema: *id012
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - claim
          - start
          - heartbeat
          - release
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 100
      responses: &id017
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '413': *id007
        '415': *id008
        '422': *id009
        '429': *id010
        '503': *id011
        '200':
