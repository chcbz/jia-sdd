        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '413': *id007
        '415': *id008
        '422': *id009
        '429': *id010
        '503': *id011
        '200':
          description: Success or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReworkReceiptResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReworkRequest'
  /agent/tasks/{taskId}/work-items/{workItemId}/lease:
    get:
      operationId: getWorkLease
      x-release: R2
      security: *id014
      description: Current work-item state for authorized dispatched/execution run.
        Active leaseToken only if execution_run_id matches ticket run. No user JWT.
      parameters:
      - *id015
      - *id016
      responses: *id017
components:
  securitySchemes:
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT with exact jiacn/client_id and persisted source owner
    RunTicket:
      type: http
      scheme: bearer
      bearerFormat: opaque-run-ticket
      description: Short-lived ticket exchanged through authenticated Agent WS, dynamic
        binding check
  schemas:
    Source:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - TASK
          - CONVERSATION
        id: *id012
      required:
      - type
      - id
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        requestId: *id012
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - retryable
      - requestId
    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        runId: *id012
        source:
          $ref: '#/components/schemas/Source'
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: basename only; no separators/control chars
        size: &id018
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
        sha256: &id022
          type: string
          pattern: ^[0-9a-f]{64}$
        mime:
          type: string
          maxLength: 100
      required:
      - runId
      - source
      - name
      - size
      - sha256
      - mime
    Upload:
      type: object
      additionalProperties: false
      properties:
        uploadId: *id012
        state:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - VERIFYING
          - READY
          - REJECTED
          - EXPIRED
        uploadUrl:
          type: string
          description: same-origin relative path
        expiresAt: *id018
        objectId: *id012
        errorCode:
