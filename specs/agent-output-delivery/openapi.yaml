openapi: 3.1.0
info:
  title: CYF Output Delivery v1.1
  version: 1.1.0
  description: DESIGN CONTRACT ONLY. HTTP-first R1/R2; no implementation or deployment
    claimed. All decimal bigint values are strings.
paths:
  /agent/output-capabilities:
    get:
      operationId: getOutputCapabilities
      x-release: R1
      security:
      - UserJwt: []
      description: ''
      parameters: []
      responses:
        '400': &id001
          description: Invalid fields or manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing/expired credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Credential lacks operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Missing or inaccessible resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id005
          description: Version/state/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': &id006
          description: Expired resource, only after authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id007
          description: File/run quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id008
          description: Unsupported type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id009
          description: Integrity or delivery requirements failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id010
          description: Rate/concurrency quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id011
          description: Dependency unavailable; retry safely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Success or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /agent/output-uploads:
    post:
      operationId: createUpload
      x-release: R1
      security:
      - RunTicket: []
      description: ''
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 100
      responses:
        '400': *id001
