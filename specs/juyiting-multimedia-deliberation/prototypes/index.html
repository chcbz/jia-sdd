<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>聚义厅 · 多媒体协作原型</title>
<link rel="stylesheet" href="prototype.css">
<script src="prototype.js" defer></script>
</head>
<body>
<div class="preview-bar"><span>交互原型 <em>示意数据 · 不连接真实 Agent</em></span><nav aria-label="原型页面"><button data-page="request">提需求</button><button data-page="agents">选 Agent</button><button data-page="chat">议事</button><button data-page="accept">验收</button><button data-page="done">已完成</button><button data-page="space">工作空间</button></nav></div>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><span class="seal">聚</span><div>聚义厅<small>把想法变成成果</small></div></div><button class="new-request" data-action="new">＋ 提需求</button><div class="nav-label">我的协作</div><button class="side-link is-current" data-page="chat">悬赏议事 <span>1</span></button><button class="side-link" data-page="space">工作空间</button><div class="sidebar-bottom"><span class="user-avatar">我</span><div>我的空间<small>资料由你掌握</small></div></div></aside>
<div class="main-shell"><header class="app-header"><div><span class="mobile-brand">聚义厅</span><span class="breadcrumb">聚义厅 <span>/</span> <b id="breadcrumb-current">提需求</b></span></div><span class="private-note">仅你和参与的 Agent 可见</span></header><main id="main"></main></div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
