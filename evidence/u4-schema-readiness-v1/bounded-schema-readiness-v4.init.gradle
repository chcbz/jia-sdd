String sha256File(File file) {
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = stream.read(buffer)) != -1) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

Map sha256Directory(File directory) {
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    List<File> files = []
    directory.eachFileRecurse { file -> if (file.isFile()) files.add(file) }
    files.sort { a, b ->
        directory.toPath().relativize(a.toPath()).toString().replace(File.separatorChar, '/' as char) <=>
                directory.toPath().relativize(b.toPath()).toString().replace(File.separatorChar, '/' as char)
    }
    long total = 0L
    files.each { file ->
        String relative = directory.toPath().relativize(file.toPath()).toString()
                .replace(File.separatorChar, '/' as char)
        String line = relative + '\u0000' + file.length() + '\u0000' + sha256File(file) + '\n'
        digest.update(line.getBytes(StandardCharsets.UTF_8))
        total += file.length()
    }
    [sha256: digest.digest().encodeHex().toString(), fileCount: files.size(), sizeBytes: total]
}

String gitValue(File cwd, String expression) {
    Process process = new ProcessBuilder('git', '-C', cwd.absolutePath, 'rev-parse', expression)
            .redirectErrorStream(true).start()
    String output = process.inputStream.getText('UTF-8').trim()
    int exit = process.waitFor()
    if (exit != 0) throw new GradleException("git rev-parse failed for ${cwd}: ${output}")
    output
}

void writeClassManifest(File directory, File destination) {
    List<Map> rows = []
    directory.eachFileRecurse { file ->
        if (file.isFile() && file.name.endsWith('.class')) {
            rows.add([
                    path: directory.toPath().relativize(file.toPath()).toString()
                            .replace(File.separatorChar, '/' as char),
                    size_bytes: file.length(),
                    sha256: sha256File(file)
            ])
        }
    }
    rows.sort { it.path }
    destination.parentFile.mkdirs()
    destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            class_count: rows.size(), classes: rows
    ])) + '\n'
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.layout.buildDirectory.set(root.layout.dir(root.provider { new File(runRoot, 'gradle-build') }))

    List<String> classpathPaths = classpathFile.readLines('UTF-8').findAll { !it.isBlank() }
    def frozenClasspath = root.files(classpathPaths)
    def mainCompileClasspath = root.files(classpathPaths + [lombokJar.absolutePath])
    def mainSourcePaths = [
            new File(root.rootDir, 'chat/jia-chat-service/src/main/java/cn/jia/chat/config/ChatSchemaInitializer.java'),
            new File(root.rootDir, 'chat/jia-chat-service/src/main/java/cn/jia/chat/config/ChatDeliberationSchemaInitializer.java'),
            new File(root.rootDir, 'chat/jia-chat-service/src/main/java/cn/jia/chat/config/ChatConversationArchiveSchemaInitializer.java'),
            new File(root.rootDir, 'chat/jia-chat-service/src/main/java/cn/jia/chat/config/ChatSchemaReadiness.java')
    ]
    File lifecycleSource = new File(root.rootDir,
            'chat/jia-chat-service/src/chatDeliberationTest/java/cn/jia/chat/config/ChatSchemaReadinessLifecycleTest.java')

    def preflight = root.tasks.register("${TASK_PREFIX}Preflight") {
        group = 'verification'
        description = 'Validates exact U4 source, baseline and fixed classpath without project dependencies.'
        outputs.upToDateWhen { false }
        doLast { task ->
            if (runRoot.exists()) throw new GradleException("Bounded output already exists: ${runRoot}")
            if (sha256File(classpathFile) != 'ffe71b5989fa529a9866319891ecf6fd06cfc58efdd0a2b623bdaa10fa9ebaf4')
                throw new GradleException('Bounded classpath path-list digest changed')
            if (sha256File(classpathContentFile) != 'e3dcd2e3ad4da6d63594045cd84e3fef67881d27d3190592bd9df58c63d58a1b')
                throw new GradleException('Bounded classpath content manifest changed')
            if (sha256File(sourceManifestFile) != '0ad05c0a2410481532aa09cdba757d0659ac9b350a768db8ec211d0e4594cbae')
                throw new GradleException('Bounded source manifest changed')

            Map sourceManifest = new JsonSlurper().parse(sourceManifestFile) as Map
            sourceManifest.sources.each { row ->
                File source = new File(row.path as String)
                if (!source.isFile() || sha256File(source) != row.sha256)
                    throw new GradleException("Source digest mismatch: ${source}")
            }
            if (!lombokJar.isFile() || sha256File(lombokJar) != sourceManifest.lombok.sha256)
                throw new GradleException('Lombok processor digest mismatch')

            Map content = new JsonSlurper().parse(classpathContentFile) as Map
            if (classpathPaths.size() != 364 || content.entry_count != 364)
                throw new GradleException('Bounded classpath must contain exactly 364 frozen entries')
            content.entries.each { row ->
                File entry = new File(row.path as String)
                if (!entry.exists()) throw new GradleException("Missing classpath entry: ${entry}")
                Map actual = entry.isDirectory()
                        ? sha256Directory(entry)
                        : [sha256: sha256File(entry), fileCount: 1, sizeBytes: entry.length()]
                if (actual.sha256 != row.sha256 || actual.fileCount != row.file_count
                        || actual.sizeBytes != row.size_bytes)
                    throw new GradleException("Classpath content changed: ${entry}")
            }

            File baseline = new File('/home/isp/wsps/cyf/.worktrees/juyiting-multimedia-deliberation-20260928/api-output-asset-archive')
            if (gitValue(baseline, 'HEAD') != '194ec91a596c28f9575a64aef47a5bf7b9fb6778'
                    || gitValue(baseline, 'HEAD^{tree}') != '10d312e61057b1a83da1485238c2f3acf63e5361')
                throw new GradleException('Exact 194ec baseline worktree changed')
            if (gitValue(root.rootDir, 'HEAD') != '3f079c7cfa7b076e93d185db50faaf4183a584e4'
                    || gitValue(root.rootDir, 'HEAD^{tree}') != '768da03f2c3222fb1e30529beb6089e1000227fa')
                throw new GradleException('Candidate worktree changed')

            if (!frozenClasspath.buildDependencies.getDependencies(task).isEmpty()
                    || !mainCompileClasspath.buildDependencies.getDependencies(task).isEmpty())
                throw new GradleException('Frozen classpath unexpectedly carries builtBy dependencies')
            runRoot.mkdirs()
            new File(runRoot, 'preflight.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    candidate_commit: gitValue(root.rootDir, 'HEAD'),
                    candidate_tree: gitValue(root.rootDir, 'HEAD^{tree}'),
                    baseline_commit: gitValue(baseline, 'HEAD'),
                    baseline_tree: gitValue(baseline, 'HEAD^{tree}'),
                    classpath_entries: classpathPaths.size(),
                    classpath_built_by_tasks: [],
                    source_count: 5
            ])) + '\n'
        }
    }

    def compileMain = root.tasks.register("${TASK_PREFIX}CompileMain", JavaCompile) {
        dependsOn(preflight)
        source(root.files(mainSourcePaths))
        classpath = mainCompileClasspath
        destinationDirectory.set(root.layout.dir(root.provider { mainOverlay }))
        sourceCompatibility = '21'
        targetCompatibility = '21'
        options.release.set(21)
        options.encoding = 'UTF-8'
        options.incremental = false
        options.fork = false
        options.annotationProcessorPath = root.files(lombokJar.absolutePath)
        options.compilerArgs.add('-parameters')
        outputs.cacheIf { false }
        doLast { writeClassManifest(mainOverlay, new File(runRoot, 'main-overlay-manifest.json')) }
    }

    def compileTest = root.tasks.register("${TASK_PREFIX}CompileLifecycleTest", JavaCompile) {
        dependsOn(compileMain)
        source(root.files(lifecycleSource.absolutePath))
        classpath = root.files([mainOverlay.absolutePath] + classpathPaths)
        destinationDirectory.set(root.layout.dir(root.provider { testOverlay }))
        sourceCompatibility = '21'
        targetCompatibility = '21'
        options.release.set(21)
        options.encoding = 'UTF-8'
        options.incremental = false
        options.fork = false
        options.compilerArgs.addAll(['-parameters', '-proc:none'])
        outputs.cacheIf { false }
        doLast { writeClassManifest(testOverlay, new File(runRoot, 'test-overlay-manifest.json')) }
    }

    def lifecycleTest = root.tasks.register("${TASK_PREFIX}SchemaReadinessLifecycle", Test) {
        dependsOn(compileTest)
        testClassesDirs = root.files(testOverlay.absolutePath)
        classpath = root.files([testOverlay.absolutePath, mainOverlay.absolutePath] + classpathPaths)
        useJUnitPlatform()
        scanForTestClasses = false
        filter {
            includeTestsMatching('cn.jia.chat.config.ChatSchemaReadinessLifecycleTest')
            failOnNoMatchingTests = true
        }
        maxParallelForks = 1
        forkEvery = 0
        maxHeapSize = '128m'
        jvmArgs '-XX:MaxMetaspaceSize=96m', '-XX:ActiveProcessorCount=1', '-XX:+UseSerialGC',
                "-Xlog:class+load=info:file=${classLoadLog.absolutePath}:time,level,tags"
        workingDir = runRoot
        reports.html.outputLocation.set(root.layout.dir(root.provider { new File(runRoot, 'html-report') }))
        reports.html.required.set(false)
        reports.junitXml.outputLocation.set(root.layout.dir(root.provider { junitXml }))
        reports.junitXml.required.set(true)
        binaryResultsDirectory.set(root.layout.dir(root.provider { new File(runRoot, 'binary-results') }))
        outputs.upToDateWhen { false }
        testLogging { events 'passed', 'failed', 'skipped' }
        doLast {
            if (!classLoadLog.isFile()) throw new GradleException('Missing JVM class-load proof')
            String loaded = classLoadLog.getText('UTF-8')
            Map<String, String> expected = [
                    'cn.jia.chat.config.ChatSchemaInitializer': mainOverlay.absolutePath,
                    'cn.jia.chat.config.ChatDeliberationSchemaInitializer': mainOverlay.absolutePath,
                    'cn.jia.chat.config.ChatConversationArchiveSchemaInitializer': mainOverlay.absolutePath,
                    'cn.jia.chat.config.ChatSchemaReadiness': mainOverlay.absolutePath,
                    'cn.jia.chat.config.ChatSchemaReadinessLifecycleTest': testOverlay.absolutePath
            ]
            Map<String, List<String>> proof = [:]
            expected.each { type, directory ->
                List<String> matching = loaded.readLines().findAll {
                    it.contains(" ${type} source:") && it.contains(directory)
                }
                if (matching.isEmpty()) throw new GradleException("Overlay type was not loaded from expected directory: ${type}")
                proof[type] = matching
            }
            new File(runRoot, 'overlay-load-proof.json').text =
                    JsonOutput.prettyPrint(JsonOutput.toJson(proof)) + '\n'
        }
    }

    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(lifecycleTest.get())) {
            Set<String> expected = [
                    preflight.get().path,
                    compileMain.get().path,
                    compileTest.get().path,
                    lifecycleTest.get().path
            ] as Set
            Set<String> actual = graph.allTasks.collect { it.path } as Set
            if (actual != expected)
                throw new GradleException("Unexpected bounded task graph; expected=${expected}, actual=${actual}")
            runRoot.parentFile.mkdirs()
            File graphEvidence = new File(evidenceRoot, 'bounded-task-graph-768da03f-v4.json')
            if (graphEvidence.exists())
                throw new GradleException("Bounded task graph evidence already exists: ${graphEvidence}")
            graphEvidence.text = JsonOutput.prettyPrint(
                    JsonOutput.toJson([expected: expected.sort(), actual: actual.sort()])) + '\n'
        }
    }
}
