        evidence.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            source_commit: 'b934bc76a57428f21b434c4edef9fc79b4487e5f',
            source_tree: '169aab6f302719701bb92a9fd6b131037c044ea1',
            scope: 'normal selected module regressions and actual dependent production-source compile; no frozen classpath or source overlay',
            tasks: graph.allTasks.collect { it.path }
