// not resource admission gates or performance-deadline controls.
gradle.projectsEvaluated {
    gradle.rootProject.allprojects { project ->
        project.tasks.withType(Test).configureEach {
            maxParallelForks = 1
            forkEvery = 1
            maxHeapSize = '128m'
            jvmArgs '-XX:MaxMetaspaceSize=96m', '-XX:ActiveProcessorCount=1', '-XX:+UseSerialGC'
            testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
