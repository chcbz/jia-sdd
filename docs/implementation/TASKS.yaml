policy:
  # Current capacity projection; MODEL_ROUTING.yaml#execution_policy is authoritative.
  max_parallel_writers: 3
  execution_mode: task_worktree_path_scoped_parallel_writers
  max_parallel_read_only_support: 1
  automatic_promotion_after_acceptance: true
  per_task_user_confirmation_required: false
  active_progress_reporting: true
  reporting_mode: "task_terminal_or_exception_or_user_action"
  runtime_ledger: "runtime_ledger_json; per-task fields are owner/exact_sha_tree/current_gate/blocker/next_action"
  failure_retry_policy: "attribute before retry; second consecutive failure blocks; only matrix-bound authorize-remediation may resume"
  notification_policy: "durable outbox + optional delivery hook on completion, abnormality, or required user action"
  control_plane_writer: main_orchestrator
