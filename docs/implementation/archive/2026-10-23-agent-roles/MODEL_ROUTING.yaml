schema_version: 9
updated_at: "2026-10-08"

execution_policy:
  task_mode: task_worktree_path_scoped_parallel_writers
  parallel_policy_source: user_explicit_2026_10_08
  max_active_source_writers: 3
  max_parallel_read_only_support: 1
  max_threads: 5
  default_subagent_policy: on_demand_only
  writer_reviewer_separation: owner_self_check_no_independent_reviewer
  prefer_cross_model_review: disabled_by_user
  independent_reviewer_enabled: false
  reviewer_policy_source: user_explicit_2026_09_12
  # Historical reviewer routes below are evidence/compatibility only; do not schedule them.
  one_writer_per_worktree: true
  reviewer_read_only: true
  support_agents_source_read_only: true
  control_plane_writer: main_orchestrator
  gradle_lock: /tmp/cyf-gradle.lock
  production_changes_require_explicit_task: true
  automatic_promotion_after_acceptance_or_self_check: true
  per_task_user_confirmation_required: false
  active_progress_reporting: true
  reporting_mode: "task_terminal_or_exception_or_user_action"
  runtime_ledger: "docs/implementation/TASKS.yaml#runtime_ledger_json"
  orchestration_entrypoint: "python3 ops/orchestration/cyf_orchestrator.py"
  failure_policy:
    attribution_before_retry: true
    consecutive_failure_limit: 2
    consecutive_scope: same_root_cause_and_unchanged_input
    changed_candidate_or_user_supplied_resource_resets_attempt_scope: true
    on_limit: blocked_root_cause_matrix
  proactive_notification_events: [completed, abnormality, user_action_required]
  risk_tier_policy:
    L0:
      scope: [read_only_query, status_check, documentation, candidate_generation, static_check]
      review: none
      execution: direct
      synchronous_wait_threads: forbidden
    L1:
      scope: [reversible_config_write_without_runtime_side_effect, flow_yaml_update_without_start, draft_resource]
      review: self_check
      required_controls: [backup_previous_value, exact_candidate_hash, single_write, readback, no_blind_retry]
      synchronous_wait_threads: forbidden
    L2:
      scope: [ordinary_source_change, targeted_test, cloud_build_without_deploy, noncritical_integration]
      review: owner_self_check_then_component_verification
      verification: smallest_relevant_selector_then_reuse_exact_tree_evidence
    L3:
      scope: [identity, acl, transaction, migration, production_data_change, exceptional_out_of_pipeline_restart, rollback]
      review: owner_risk_self_check
      final_gate: exact_authorization_and_automated_release_checks
  flow_operation_classification:
    update_pipeline_without_start: L1
    start_build_without_deploy: L2
    develop_push_verification: cloud_checks_without_deployment
    versioned_release: authorized_pipeline_checks
    exceptional_out_of_pipeline_production_change: L3
  # CYF project scope only; no change to Codex/global/shared skills or live Flow configuration.
  component_delivery_policy:
    policy_source: user_explicit_2026_10_08
    authority: docs/aliyun-flow-cicd-strategy.md
    web:
      execution: aliyun_flow
      pipeline_id: 4403172
      build_identity: real_flow_run
      local_production_build: forbidden
    api:
      execution: local_fixed_clean_commit_worktree
      gradle_entrypoint: ops/orchestration/cyf_orchestrator.py
      build_identity: local_build_id_and_logs
      default_backend_flow: disabled
      production_directory_build: forbidden
      local_install_adapter: pending_adaptation_and_acceptance
    cloud_configuration_changed_by_policy_write: false
  develop_verification_policy:
    components: [api, web]
    branch: develop
    trigger: component_validation_without_deployment
    deploy_enabled: false
    per_run_reviewer_required: false
    per_run_human_ticket_required: false
    mandatory_ci_only_prerequisite: false
    checks: [component_authoritative_tests, component_authoritative_build, same_batch_artifact_integrity]
    high_risk_review_timing: owner_self_check_before_merge_no_independent_reviewer
  versioned_release_policy:
    policy_source: user_explicit_2026_10_08_preserving_no_auto_deploy_2026_10_06
    components: [api, web]
    trigger: explicit_version_release
    binding: [version, commit, tree_sha, component_build_identity, artifact_digest]
    checks: [component_authoritative_tests, component_authoritative_build, same_batch_artifact_integrity, deployment_mutex, health_and_business_check]
    develop_push_deployment: false
    automatic_latest_develop_schedule: false
    per_run_reviewer_required: false
    per_run_human_ticket_required: false
    mandatory_ci_only_prerequisite: false
  reviewer_wait_policy:
    poll_only_when_l3_execution_is_ready_and_review_is_the_last_blocker: false
    repeated_unchanged_waits: forbidden
    l0_l1_must_not_wait_for_reviewer: true
  cross_thread_conflict_policy:
    action: alert_only
    event: coordination_required
    command: "python3 ops/orchestration/cyf_orchestrator.py conflict-alert"
    critical_path_semantics: "admission control for new claims only; never preemption authority"
    gradle_lock_semantics: "serialize admitted verifiers; never terminate the holder or waiters"
    process_control_authority: "exact thread ownership plus explicit user/main-controller authorization; coordination threads remain alert-only"
    forbidden_operations: [foreign_process_signal, foreign_gradle_daemon_operation, foreign_systemd_unit_operation, foreign_evidence_operation]
    forbidden_blocker_categories: [critical_path_preemption, process_preemption, automatic_termination]
  route_precedence:
    - provider_health_fallback
    - explicit_task_route
    - p0_risk_route
    - domain_route
    - generic_route
  source_write_rule: >-
    当前最多 3 个源码 Writer 与 1 个只读辅助并行，线程容量 5；这是按需调度上限，不要求占满槽位。
    不同任务可由不同 Writer 在独立 worktree 并行实施；每个任务仍只有一个源码 Owner，并在 claim 前冻结 owned paths。
    owned paths 不重叠时不得因 critical path 或其他 Writer 而等待；路径重叠时只协调交接，不回退或抢占他人修改。
    docs/implementation 仅由 main_orchestrator 修改；Gradle 通过 /tmp/cyf-gradle.lock 全局串行，隔离 MySQL/Rabbit 和重型磁盘资源按门禁协调。

model_selection_policy:
  policy_source: user_explicit_two_models_only_2026_10_08
  status: configured_runtime_unverified
  allowed_models: [gpt-6.1-sol, gpt-6-luna]
  high_risk_model: gpt-6.1-sol
  routine_and_support_model: gpt-6-luna
  selection_basis: user_explicit_targets_and_task_risk_not_official_benchmark
  reasoning_policy: preserve_role_high_or_medium_pending_runtime_validation
  automatic_legacy_model_fallback: false
  unavailable_model_action: report_exact_error_no_silent_substitution
  escalation_rule: "Luna 任务涉及跨模块状态语义、启动恢复、身份/ACL、幂等、事务、并发或迁移时，协调 owned paths 与单 Owner 交接给 Sol；不新增 Reviewer。"
  runtime_validation: not_dispatched
  scope_note: "按用户明确指定的精确 ID 更新项目角色配置，不宣称已验证官方可用性、性能或当前会话热重载，不切换当前主会话或运行中 Agent。"
  legacy_roles: "保留 Spark/Mini/DeepSeek 历史角色名以免破坏任务引用；模型绑定全部改为上述两种，旧健康证据不能作为新模型可用证据。"
  invariants: "3 Writer/1 只读辅助/线程容量5；单 Owner、独立 worktree、路径隔离；Reviewer 和 DeepSeek 提供商仍禁用。"

provider_health:
  checked_at: "2026-08-23T16:20:00+08:00"
  deepseek:
    status: disabled_by_user
    evidence: "2026-08-23 用户明确要求暂时所有 Agent 均不使用 DeepSeek 模型；此前亦出现 auth_unavailable。"
    critical_path_policy: "禁止 DeepSeek 健康探针、claim 和自动恢复；所有新任务直接使用 GPT 路由。"
    worker_fallbacks:
      deepseek_pro_worker_backend: critical_worker
      deepseek_pro_worker_frontend: balanced_worker
      deepseek_flash_worker: balanced_worker
      test_runner: gpt_test_runner
      deepseek_pro_reviewer: sol_reviewer
      adversarial_reviewer: sol_reviewer
    restore_policy: "仅用户明确重新启用后才可恢复 DeepSeek；恢复前需重新冻结路由并做一次非关键路径健康探针。"

# Historical M2 phase examples only; execution_policy above governs current capacity and Owner self-check.
# These examples do not re-enable independent Reviewers or limit current work to the old phase slots.
pipeline:
  backend_contract_phase:
    applies_until: C05F
    slots:
      A:
        role: active_source_writer
        capacity: 1
        purpose: "当前任务独占其 worktree/owned paths 的源码 Writer"
      B:
        role: explorer
        capacity: 1
        purpose: "准备下一微阶段调用链、路径冲突和契约事实"
      C:
        role: fast_query
        capacity: 1
        purpose: "准备 acceptance -> path -> test -> evidence 矩阵"
      D:
        role: gpt_test_runner_or_reviewer
        capacity: 1
        purpose: "最终候选验证或独立 Review；不与重型验证重叠"
  frontend_overlap_phase:
    starts_after: C05F
    slots:
      A:
        role: web_source_writer
        capacity: 1
        purpose: "C06-C07F 任务级源码 Writer；可与不重叠任务并行"
      B:
        role: c08a_read_only_gate
        capacity: 1
        purpose: "API 累计 evidence/回归门禁；发现源码问题时在独立 worktree claim，路径冲突才协调"
      C:
        role: explorer_or_fast_query
        capacity: 1
        purpose: "下一微阶段只读准备和 evidence indexing"
      D:
        role: gpt_test_runner_or_reviewer
        capacity: 1
        purpose: "串行测试或已提交阶段的独立 Review"
  promotion_rule: >-
    每个原始任务 ID 仍保留独立 commit、acceptance 和状态。L0/L1 在最小自检通过后直接推进；L2 在任务包或最终候选只做一次独立 Review；
    L3 才要求阻塞式独立发布门禁。无需逐项等待用户确认；完成、异常或需要用户处理时主动汇报。仅相同根因且输入未变化的连续第二次失败停轮并输出根因矩阵。

