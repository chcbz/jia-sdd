coordination_guards:
  ledger_task_fields: [owner, exact_sha_tree, current_gate, blocker, next_action]
  duplicate_active_agent_forbidden: true
  critical_path_order_enforced: true
  support_agents_may_run_gradle: false
  reviewers_may_write_or_repair: false
  gradle_entrypoint_required: true
  failure_attribution_entrypoint_required: true

verification_policy:
  writer_scope: "只运行 touched-suite 或 targeted tests；不得把模块全量回归作为每轮默认动作。"
  candidate_scope: "每个最终候选 tree 由可用 test runner 独立运行一次模块全量测试。"
  mysql_scope: "每个最终 schema/migration/transaction tree 只运行一次隔离 MySQL；失败修复后证据键变化才重跑。"
  reviewer_scope: "Reviewer 默认复用可验证证据，不重复全量 Gradle；仅发现证据失效、覆盖缺口或 tree 变化时补跑。"
  cumulative_scope: "API/Web 全量累计回归集中在 C08A/C08W。"
  heavy_commands_global_parallelism: 1
  gradle_parallelism: 1
  gradle_lock: /tmp/cyf-gradle.lock
  evidence_key: "git_tree_sha + test_selector + db_fixture_digest + rabbit_topology_manifest_digest"
  evidence_reuse: true
  byte_exact_merge:
    required_records: [merge_parent_sha, source_sha, source_tree_sha, merge_tree_sha]
    full_code_review_required: false
    full_code_review_trigger: [merge_conflict, semantic_edit, tree_mismatch]

resource_policy:
  fixed_memory_disk_admission_gate: disabled_by_user_2026_08_28
  resource_snapshot_required: true
  applies_before: [gradle_full_suite, npm_full_build, isolated_mysql, isolated_rabbitmq, integration_worktree]
  below_former_threshold_action: "记录观测并继续；不得自动删除未知文件、stash、活跃 worktree、证据或生产数据。"
  serialized_resources: [gradle, isolated_mysql, isolated_rabbitmq, heavy_disk]
  attributable_runtime_failures: [oom, enospc, inode_exhaustion, swap_thrashing]

quality_kpis:
  p0_first_review_max_blocking_findings: 0
  p0_max_review_rounds: 2
  p1_ui_max_review_rounds: 1
  module_full_test_runs_per_final_tree: 1
  isolated_mysql_runs_per_final_tree: 1
  duplicate_review_for_byte_exact_merge: 0
  disk_blocks_after_claim: 0
  deepseek_auth_wait_retries_per_bundle: 0
  expected_cycle_reduction: "15%-25%"
  expected_saved_execution_days: "3-4"

visual_policy:
  review_model: gpt-6.1-sol
  review_role: vision_reviewer
  multimodal_review: "仅当 C07B/C07C 引入新视觉资产或需要截图回归时 required"
  image_generation_model: gpt-image-2
  image_generation_on_critical_path: false

