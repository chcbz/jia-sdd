.bounty-panel {
  position: relative;
  display: flex;
  flex: 1;
  min-width: 0;
  min-height: 0;
  box-sizing: border-box;
  flex-direction: column;
  overflow: hidden;
}

/* The list needs a bounded flex parent so it can own scrolling inside the Hall panel. */
.bounty-source {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

button {
  border: 0;
  cursor: pointer;
  font: inherit;
}

.ordinary-cancellation {
  display: grid;
  gap: 12px;
  min-width: 0;
  margin: 16px 0;
  padding-top: 16px;
  border-top: 1px solid var(--hall-border, #eadfd4);
}

.ordinary-cancellation > p {
  margin: 0;
  color: var(--hall-text-secondary, #68716b);
  font-size: 13px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.ordinary-cancel-action {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  box-sizing: border-box;
  padding: 9px 14px;
  border: 1px solid var(--hall-brand, #923f30);
  border-radius: 8px;
  background: var(--hall-surface, #fffefa);
  color: var(--hall-brand, #923f30);
  font-weight: 500;
  white-space: normal;
  overflow-wrap: anywhere;
}
.ordinary-cancel-action:hover:not(:disabled) { background: #f6eee8; border-color: #793326; }
.ordinary-cancel-action:focus-visible { outline: 3px solid #923f3080; outline-offset: 3px; }
.ordinary-cancel-action:disabled { opacity: .55; cursor: not-allowed; }

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.panel-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) 44px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  color: #765f40;
  font-size: 13px;
}


.panel-toolbar button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 8px;
  background: #efe0c6;
  color: #4a3423;
}

.task-search { display: contents; }

.task-search input,
.task-search select {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 10px;
  border: 1px solid var(--hall-border-strong, #d7c3a2);

}

.task-search input:focus-visible,
.task-search select:focus-visible,

}

.panel-toolbar .task-refresh {

  height: 44px;

}

.task-refresh .toolbar-label {

  width: 1px;
  height: 1px;

}

.requirement-create-recovery {

  margin: 0 16px 12px;

  grid-template-columns: minmax(0, 1fr);

.recommended-agent-actions button {

.recommended-agents small {

.recommended-agents small,
.recommended-agents p {

}

.recommended-agents em {

.task-state-open,
.task-state-planning,
.task-state-assigned,
.task-state-running,
.task-state-reviewing,
.task-state-blocked,
.task-state-done,

}

.task-state-running,

}

.empty-list {

/* Modal Styles */
.bounty-modal-overlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  background: transparent;
  padding: 16px;
  isolation: isolate;
  contain: layout paint;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}

.bounty-modal-overlay,
.bounty-modal,
.bounty-modal * {
  box-sizing: border-box;
}

.bounty-modal-overlay::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background: rgba(15, 10, 6, 0.72);
  opacity: 1;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  pointer-events: none;
}

.bounty-modal {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 560px;
  max-height: min(90vh, 720px);
  border: 1px solid rgba(255, 240, 202, 0.28);
  border-radius: 12px;
  background:
    linear-gradient(155deg, #fdf6ea 0%, #f2e0bd 100%);
  color: #2f261c;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.18),
    0 18px 48px rgba(0, 0, 0, 0.42);
  overflow: hidden;
  opacity: 1;
  transform: translate3d(0, 0, 0);
  transform-origin: center bottom;
  backface-visibility: hidden;
  contain: layout paint;
  will-change: transform, opacity;
  isolation: isolate;
}

.bounty-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(124, 31, 27, 0.16);
  background: linear-gradient(135deg, rgba(124, 31, 27, 0.06), transparent);
}

.bounty-modal-header h3 {
  margin: 0;
  font-size: 18px;
  color: #7c1f1b;
}

.modal-close {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(124, 31, 27, 0.1);
  color: #7c1f1b;
  transition: background 0.18s;
}

.modal-close:hover {
  background: rgba(124, 31, 27, 0.2);
}

.bounty-modal-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overflow-y: auto;
}

.workspace-shortcut {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 14px 0;
  padding: 12px;
  border: 1px solid #d7c3a2;
  border-radius: 8px;
  background: #fff8e8;
}

.workspace-shortcut strong,
.workspace-shortcut p {
  display: block;
  margin: 0;
}

.workspace-shortcut p {
  margin-top: 3px;
  color: #765f40;
  font-size: 12px;
}

.workspace-shortcut button {
  flex: 0 0 auto;
  min-height: 34px;
  padding: 0 10px;
  border-radius: 7px;
  background: #6d3f1f;
  color: #fff8e8;
}

.modal-task-info {
  flex: 0 0 auto;
  padding: 14px 16px 0;
}

.modal-agent-scroll {
  flex: 0 0 auto;
  margin-top: 12px;
  padding: 0 16px 16px;
}

/* Modal Transition */
.modal-enter-active,
.modal-leave-active {
  transition: none;
}

.modal-enter-active::before,
.modal-leave-active::before {
  transition: opacity 0.16s ease-out;
  will-change: opacity;
}

.modal-enter-active .bounty-modal,
.modal-leave-active .bounty-modal {
  transition:
    transform 0.18s cubic-bezier(0.2, 0, 0, 1),
    opacity 0.14s ease-out;
  will-change: transform, opacity;
}

.modal-enter-from::before,
.modal-leave-to::before {
  opacity: 0;
}

.modal-enter-from .bounty-modal {
  opacity: 0;
  transform: translate3d(0, 10px, 0);
}

.modal-leave-to .bounty-modal {
  opacity: 0;
  transform: translate3d(0, 10px, 0);
}

@media (prefers-reduced-motion: reduce) {
  .modal-enter-active,
  .modal-leave-active,
  .modal-enter-active::before,
  .modal-leave-active::before,
  .modal-enter-active .bounty-modal,
  .modal-leave-active .bounty-modal {
    transition: none;
  }
}

@media (max-width: 900px) {
  .bounty-modal-overlay {
    padding: 10px;
  }

  .task-panel-body {
    grid-template-columns: 1fr;
  }

  .task-panel-body {
    overflow: auto;
  }

  .task-list,
  .task-detail-card {
    overflow: visible;
  }

  .task-operation-grid {
    justify-content: flex-start;
  }

  .recommended-agent-row {
    grid-template-columns: 1fr;
  }

  .recommended-agent-main {
    grid-template-columns: 22px 38px minmax(0, 1fr) auto;
  }

  .recommended-agent-actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    justify-content: stretch;
  }

  .recommended-agent-actions button {
    width: 100%;
    min-width: 0;
    height: 34px;
  }

  .bounty-modal {
    width: 100%;
    max-width: 100%;
    max-height: 100%;
  }
}

  content: "";
  position: absolute;

  background: rgba(18, 13, 10, 0.42);

/* A handling session is one active, near-full work window. Landscape does
 * not degrade it into a right-side half drawer. */
.panel-overlay.is-full-window[data-v-hall] {
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
}
.panel-overlay.is-full-window .floating-panel.layout-full-window[data-v-hall] {
  /* The overlay owns the only outer gutter; do not subtract it again here. */
  width: min(1180px, 100%);
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  border-radius: 10px;
}

.floating-panel[data-v-hall] {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: min(860px, 100%);
  max-width: 100%;
  min-height: 0;
  max-height: 100%;
  box-sizing: border-box;
  border: 1px solid rgba(71, 44, 23, 0.2);
  border-radius: 8px;
  background: #fffaf0;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
  overflow: hidden;
  opacity: 1;
  transform: translate3d(0, 0, 0);
  transform-origin: center bottom;
  backface-visibility: hidden;
  contain: layout paint;
  will-change: transform, opacity;
  isolation: isolate;
}

}
.floating-panel.layout-center-modal[data-v-hall] {

  max-height: calc(100% - 48px);
}
.panel-title[data-v-hall] {

  gap: 12px;

.toast[data-v-hall] {

.toast-enter-active[data-v-hall],
.toast-leave-active[data-v-hall] {

}
.toast-enter-from[data-v-hall],
.toast-leave-to[data-v-hall] {

  transform: translate(-50%, 8px);
}
.agent-card-enter-active[data-v-hall],
.agent-card-leave-active[data-v-hall] {

}
.agent-card-enter-from[data-v-hall],
.agent-card-leave-to[data-v-hall] {

.panel-enter-active[data-v-hall],
.panel-leave-active[data-v-hall] {

}
.panel-enter-active[data-v-hall]::before,
.panel-leave-active[data-v-hall]::before {
  transition: opacity 0.16s ease-out;
  will-change: opacity;
}
.panel-enter-active .floating-panel[data-v-hall],
.panel-leave-active .floating-panel[data-v-hall] {
  transition:
    transform 0.18s cubic-bezier(0.2, 0, 0, 1),
    opacity 0.14s ease-out;
  will-change: transform, opacity;
}
.panel-enter-from[data-v-hall]::before,
.panel-leave-to[data-v-hall]::before {
  opacity: 0;
}
.panel-enter-from .floating-panel[data-v-hall] {
  transform: translate3d(0, 10px, 0);
}
.panel-leave-to .floating-panel[data-v-hall] {
  opacity: 0;
  transform: translate3d(0, 10px, 0);
}
.juyi-page.is-panel-open[data-v-hall] .hall-board,
.juyi-page.is-panel-open[data-v-hall] .map-world,
.juyi-page.is-panel-open[data-v-hall] .agent-token,
.juyi-page.is-panel-open[data-v-hall] .agent-token * {
  animation-play-state: paused !important;
}
.juyi-page.is-panel-open[data-v-hall] .map-world {

}
.juyi-page.is-virtual-landscape[data-v-hall] {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 30;
  width: 100vh;
  height: 100vw;

  height: 100dvw;

}
@media (prefers-reduced-motion: reduce) {
.panel-enter-active[data-v-hall],
  .panel-leave-active[data-v-hall],
  .panel-enter-active[data-v-hall]::before,
  .panel-leave-active[data-v-hall]::before,
  .panel-enter-active .floating-panel[data-v-hall],
  .panel-leave-active .floating-panel[data-v-hall] {
    transition: none;
}
}
