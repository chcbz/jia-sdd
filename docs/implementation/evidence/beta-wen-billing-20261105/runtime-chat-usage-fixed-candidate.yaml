name: cyf-ops-manual
sources:
  repo_0:
    type: git
    name: runtime_skill_builtin
    endpoint: https://gitee.com/chcbz/isp-install
    branch: codex/beta-wen-billing-20261105
    triggerEvents: []
    branchesFilter: ^codex/beta-wen-billing-20261105$
defaultWorkspace: repo_0
stages:
  runtime_payload:
    name: Runtime skill management payload
    jobs:
      package_runtime:
        name: Skill management regression and same-Run payload
        runsOn: public/cn-beijing
        timeoutMinutes: 9
        steps:
          build:
            name: Verify and package Runtime
            step: CustomEnvironmentBuild
            with:
              image: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
              run: |-
                set -euo pipefail
                umask 077
                timeout --signal=TERM --kill-after=10s 500 bash -euo pipefail <<'CYF_SYSTEM_CODEX_BUILD'
                stage=identity
                trap 'rc=$?; printf "CI_FAILURE stage=%s line=%s exit=%s\n" "$stage" "$LINENO" "$rc" >&2' ERR
                mark_stage() { stage="$1"; printf 'CI_STAGE %s\n' "$stage"; }
                mark_stage identity
                expected=8d9fa0fd192ed8fb6d20fa5a49def4d15b5d9de2
                test "$PIPELINE_ID" = 5264702
                test "$CI_COMMIT_SHA" = "$expected"
                test "$(git rev-parse HEAD)" = "$expected"
                test "$(git rev-parse HEAD^{tree})" = 29d34239d221051ca174a70a0ed5f14d2e2002b5
                mark_stage source_cleanliness
                # Cache plugin creates exactly this untracked root log before this step.
                # Reject all tracked changes and all other untracked paths; never delete the log.
                python3 - <<'SOURCE_CLEANLINESS'
                import subprocess, sys
                status = subprocess.check_output(['git', 'status', '--porcelain', '-z', '--untracked-files=all'])
                entries = status.split(b'\0')
                unexpected = [entry for entry in entries if entry and entry != b'?? ossutil.log']
                print('CI_SOURCE_STATUS untracked_ossutil_log=' + str(b'?? ossutil.log' in entries).lower(), flush=True)
                if unexpected:
                    print('CI_SOURCE_STATUS unexpected entries: ' + repr(unexpected), file=sys.stderr, flush=True)
                    sys.exit(1)
                SOURCE_CLEANLINESS
                # Existing installer-consumer regression pins a historical Git fixture; shallow clones lack it.
                mark_stage fixture_commit
                fixture=5666fd2c990e4577cd4e16d5a32924ea0f3a8b7b
                if ! git cat-file -e "$fixture^{commit}" 2>/dev/null; then
                  git fetch --no-tags --depth=1 origin "$fixture"
                fi
                test "$(git rev-parse "$fixture^{tree}")" = d3cdc69da62bddc48af0bc86b4f32dbfa9429b60
                test "$(git rev-parse HEAD)" = "$expected"
                # Run66 spent the 330s build budget in repository metadata before any test.
                # Pin the same signed bubblewrap RPM used by the previous successful environment;
                # no 41MB updates metadata refresh, no disabled integrity checks or missing tests.
                mark_stage system_tools
                # The worker may provide curl/python via a differently named RPM or toolchain.
                # Test the actual required commands; TLS remains verified by curl below.
                for tool in curl tar xz git python3 rpm; do command -v "$tool" || { printf 'Missing build tool: %s\n' "$tool" >&2; exit 1; }; done
                python3 --version
                if ! rpm -q --quiet bubblewrap; then
                  rpm_file="$PWD/_bubblewrap.rpm"
                  curl --fail --location --connect-timeout 15 --max-time 60 https://mirrors.aliyun.com/alinux/3/updates/x86_64/Packages/bubblewrap-0.4.0-2.2.al8.x86_64.rpm --output "$rpm_file"
                  printf '%s  %s\n' 8c054aaf7f711c42ceee8e9a58dfbe8c953c063eb3619488b3ea6e6392c70af0 "$rpm_file" | sha256sum -c -
                  signature="$(rpm -Kv "$rpm_file")"
                  printf '%s\n' "$signature"
                  ! printf '%s\n' "$signature" | grep -E 'NOKEY|NOT OK|BAD|NOTTRUSTED'
                  printf '%s\n' "$signature" | grep -E 'Signature.*key ID cac33616: OK'
                  rpm -Uvh "$rpm_file"
                fi
                rpm -q bubblewrap
                mark_stage node_toolchain
                node_sha=6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
                archive="$PWD/_node.tar.xz"
                curl --fail --location --connect-timeout 15 --max-time 90 https://mirrors.aliyun.com/nodejs-release/v24.22.1/node-v24.22.1-linux-x64.tar.xz --output "$archive"
                printf '%s  %s\n' "$node_sha" "$archive" | sha256sum -c -
                node_root="$(mktemp -d "$HOME/cyf-runtime-node.XXXXXX")"
                trap 'rm -rf -- "$node_root"' EXIT
                tar --no-same-owner -xJf "$archive" -C "$node_root"
                export PATH="$node_root/node-v24.22.1-linux-x64/bin:$PATH"
                mkdir -m 700 "$node_root/home" "$node_root/tmp"
                test "$(node --version)" = v24.22.1
                mark_stage npm_ci
                (cd conf/codex-bridge && env -i PATH="$PATH" HOME="$node_root/home" TMPDIR="$node_root/tmp" npm ci --ignore-scripts --registry=https://registry.npmmirror.com --fetch-retries=1 --fetch-timeout=60000 --no-audit --no-fund)
                mark_stage regression_tests
                mkdir -m 700 _runtime_export
                env -i PATH="$PATH" HOME="$node_root/home" TMPDIR="$node_root/tmp" node --test --test-concurrency=2 conf/codex-bridge/test/juyiting-action-model-schema.test.mjs conf/codex-bridge/test/juyiting-action-outcome.test.mjs conf/codex-bridge/test/juyiting-typed-runtime.test.mjs conf/codex-bridge/test/juyiting-review-v5.test.mjs conf/codex-bridge/test/skill-conversation.test.mjs conf/codex-bridge/test/skill-execution-store.test.mjs conf/codex-bridge/test/skill-executor.test.mjs conf/codex-bridge/test/conversation-native.test.mjs conf/codex-bridge/test/skill-install-manager.test.mjs conf/codex-bridge/test/skill-management-wire.test.mjs conf/codex-bridge/test/skill-management-node-peer.test.mjs conf/codex-bridge/test/skill-registry.test.mjs conf/codex-bridge/test/archive-position-skills.test.mjs conf/codex-bridge/test/agent-client.test.mjs conf/codex-bridge/test/skill-registration.test.mjs conf/codex-bridge/test/native-single-entry.test.mjs conf/codex-bridge/test/native-execution.test.mjs conf/codex-bridge/test/native-execution-profile.test.mjs conf/codex-bridge/test/native-artifact-session.test.mjs conf/codex-bridge/test/native-artifact-snapshot.test.mjs conf/codex-bridge/test/native-skill-config.test.mjs conf/codex-bridge/test/app-server-native-execution.test.mjs conf/codex-bridge/test/app-server-native-handshake.test.mjs conf/codex-bridge/test/typed-inspection-profile.test.mjs conf/codex-bridge/test/typed-inspection-network.test.mjs conf/cyf-agent-runtime-v1/test/install-entry-convergence.test.mjs conf/cyf-agent-runtime-v1/test/runtime-host.test.mjs conf/cyf-agent-runtime-v1/test/hosting-config.test.mjs conf/skills/native-image/test/image.test.mjs conf/cyf-agent-runtime-v1/test/provider-environments.test.mjs conf/codex-bridge/test/app-server-stream.test.mjs conf/codex-bridge/test/app-server-usage.test.mjs conf/codex-bridge/test/native-usage-receipts.test.mjs conf/codex-bridge/test/chat-usage-delivery.test.mjs conf/codex-bridge/test/chat-runtime.test.mjs conf/codex-bridge/test/materials-chat.test.mjs > _runtime_export/tests.log 2>&1 || { rc=$?; cat _runtime_export/tests.log; printf "CI_FAILURE stage=%s exit=%s\n" "$stage" "$rc" >&2; exit "$rc"; }
                cat _runtime_export/tests.log
                mark_stage runtime_payload
                node --input-type=module <<'PAYLOAD'
                import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import cp from 'node:child_process';
                import {collateExecutionPayload,validateExecutionPayload,EXECUTION_PAYLOAD_FILES} from './conf/cyf-agent-runtime-v1/lib/execution-adapter.mjs';
                const out=path.resolve('_runtime_export'),payload=path.join(out,'payload');fs.mkdirSync(payload);
                await collateExecutionPayload(path.resolve('conf/codex-bridge'),path.join(payload,'codex-bridge'));
                fs.cpSync(path.resolve('conf/codex-bridge/node_modules'),path.join(payload,'codex-bridge/node_modules'),{recursive:true,dereference:true,errorOnExist:true,force:false});
                await validateExecutionPayload(path.join(payload,'codex-bridge'),{toolchain:false});
                const installer=fs.readFileSync('conf/cyf-agent-runtime-v1/install.sh','utf8');
                const lists=[...installer.matchAll(/for file in ([\s\S]*?); do\s+install -m (0[0-7]+) "\$SOURCE_DIR\/\$file"/g)];
                if(lists.length!==2)throw Error('Runtime installer catalog changed');
                for(const m of lists){for(const name of m[1].replace(/\\\n/g,' ').trim().split(/\s+/)){
                 if(name.includes('..')||name.startsWith('/'))throw Error('Unsafe source path');
                 const dest=path.join(payload,'runtime',name);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(path.join('conf/cyf-agent-runtime-v1',name),dest);fs.chmodSync(dest,parseInt(m[2],8));
                }}
                const files=[];function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile())files.push({path:path.relative(payload,p),sha256:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'),mode:fs.statSync(p).mode&0o777});else throw Error('Unsafe payload')}}walk(payload);
                const meta={pipeline:process.env.PIPELINE_ID,run:process.env.BUILD_NUMBER,commit:process.env.CI_COMMIT_SHA,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),version:JSON.parse(fs.readFileSync(path.join(payload,'runtime/package.json'))).version,engineFileCount:EXECUTION_PAYLOAD_FILES.length,files};
                if(meta.version!=='1.3.63'||JSON.parse(fs.readFileSync('conf/codex-bridge/package.json')).version!=='1.1.52')throw Error('Unexpected candidate');
                meta.dependencyProvenance={method:'same-Run npm ci --ignore-scripts --no-audit --no-fund',lockSha256:crypto.createHash('sha256').update(fs.readFileSync('conf/codex-bridge/package-lock.json')).digest('hex'),buildNode:process.versions.node,retainedPythonRequirementsSha256:crypto.createHash('sha256').update(fs.readFileSync('conf/codex-bridge/toolchain/requirements.txt')).digest('hex')};
                fs.writeFileSync(path.join(out,'release.json'),JSON.stringify(meta,null,2)+'\n');
                console.log('RUNTIME_PAYLOAD_FILES='+files.length);console.log('RUNTIME_SOURCE='+meta.commit);console.log('RUNTIME_TREE='+meta.tree);
                PAYLOAD
                mark_stage native_image_package
                python3 - <<'IMAGE_PACKAGE'
                import hashlib, json, os, pathlib, stat, subprocess, zipfile
                root=pathlib.Path('conf/skills/native-image').resolve()
                out=pathlib.Path('_runtime_export').resolve()
                raw=subprocess.check_output(['git','ls-files','-z','--','SKILL.md','scripts','vendor'],cwd=root)
                names=sorted(os.fsdecode(x) for x in raw.split(b'\0') if x)
                assert names and 'SKILL.md' in names and len(names)==len(set(names))
                assert all(n=='SKILL.md' or n.startswith(('scripts/','vendor/')) for n in names)
                for name in names:
                    p=pathlib.PurePosixPath(name)
                    assert not p.is_absolute() and '..' not in p.parts and not any(c in name for c in ('\n','\r','\x00'))
                    q=root
                    for part in p.parts:
                        q=q/part
                        st=q.lstat()
                        assert not stat.S_ISLNK(st.st_mode)
                    assert stat.S_ISREG(st.st_mode) and st.st_nlink==1
                for key,version in [('native-image','1.0.0'),('image-generate','1.3.1'),('image-edit','1.3.1')]:
                    document=root/('SKILL.md' if key=='native-image' else 'variants/'+key+'.md')
                    subprocess.check_call(['git','ls-files','--error-unmatch','--',str(document)],stdout=subprocess.DEVNULL)
                    assert document.is_file() and not document.is_symlink()
                    text=document.read_text()
                    assert ('name: '+key+'\n') in text and ('version: "'+version+'"') in text
                    assert ('/skill-config/'+key+'.json') in text
                    archive=out/(key+'.zip')
                    with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED) as z:
                        for name in names: z.write(document if name=='SKILL.md' else root/name,arcname=name)
                    with zipfile.ZipFile(archive) as z:
                        assert z.testzip() is None and sorted(z.namelist())==names
                        assert all(not stat.S_ISLNK(i.external_attr >> 16) for i in z.infolist())
                        assert z.read('SKILL.md')==document.read_bytes()
                    size=archive.stat().st_size
                    h=hashlib.sha256()
                    with archive.open('rb') as f:
                        for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
                    meta={'commit':os.environ['CI_COMMIT_SHA'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],universal_newlines=True).strip(),'pipeline':os.environ['PIPELINE_ID'],'run':os.environ['BUILD_NUMBER'],'file':key+'.zip','skillKey':key,'skillVersion':version,'kind':'INSTRUCTION','sha256':h.hexdigest(),'byteLength':size,'entries':names}
                    (out/(key+'-package.json')).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
                    print('NATIVE_IMAGE_PACKAGE='+key,'SHA256='+h.hexdigest(),'BYTES='+str(size))
                IMAGE_PACKAGE
                
                mark_stage completed
                CYF_SYSTEM_CODEX_BUILD
          upload:
            name: Upload same-Run Runtime payload and regression evidence
            step: ArtifactUpload
            with:
              uploadType: flowPublic
              artifact: cyf_runtime_5264702
              filePath:
                - _runtime_export/
              includePathInArtifact: false