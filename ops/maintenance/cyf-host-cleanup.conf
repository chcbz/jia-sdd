# Required cleanup locks live in volatile /run; recreate on boot without truncating existing locks.
f /run/lock/cyf-clear-disk.lock 0644 root root - -
f /run/lock/cyf-release-payload-cleanup.lock 0600 root root - -
# Runtime recovery-payload retention shares these existing writer locks.
f /run/lock/cyf-host-cleanup.lock 0644 root root - -
f /run/lock/cyf-wuyong-versioned-release.lock 0600 root root - -
