# Transport only: never synthesize Authorization or X-Agent-* proof headers.
# Preserve duplicate headers and Origin so backend strict parsing remains effective.
proxy_pass_request_headers on;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Host api.chaoyoufan.cn;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Host api.chaoyoufan.cn;
# No URI component: do not strip /internal or rewrite the native route.
proxy_pass http://127.0.0.1:10018;
proxy_redirect off;
proxy_buffering off;
proxy_cache off;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_store off;
proxy_connect_timeout 20;
proxy_send_timeout 300;
proxy_read_timeout 300;
