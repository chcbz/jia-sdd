# CYF Runtime native HTTP lane. Include inside api.chaoyoufan.cn server only.
# Checked 2026-11-12 against deployed API c7c0f2d / Runtime authentication and maintenance controllers.
# Existing /agent and /ws locations are unchanged. No blanket /internal proxy.
# Backend remains authority for installation/session/channel/owner/task fencing.
# Quoted regexes preserve the bounded ID quantifiers in nginx configuration.

# Queue reads
location ~ "^/internal/agent/tasks/(?:workspace-executions/commands|conversation-executions/commands)$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Owned skill package
location ~ "^/internal/agent/skill-installations/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/package$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

