# CYF Runtime native HTTP lane. Include inside api.chaoyoufan.cn server only.
# Checked 2026-10-11 against API cf140272 / AgentRuntimeAuthenticationFilter.allowed.
# Existing /agent and /ws locations are unchanged. No blanket /internal proxy.
# Backend remains authority for installation/session/channel/owner/task fencing.
# Quoted regexes preserve the bounded ID quantifiers in nginx configuration.

# Queue reads
location ~ "^/internal/agent/tasks/(?:workspace-executions/commands|conversation-executions/(?:commands|controlled-image-v3-commands))$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Owned skill package
location ~ "^/internal/agent/skill-installations/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/package$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Workspace input reads
location ~ "^/internal/agent/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/runs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/inputs(?:/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/content)?$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Inspection input reads
location ~ "^/internal/agent/chat/requests/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/turns/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/inspection/inputs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/content$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Workspace execution writes
location ~ "^/internal/agent/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/runs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/(?:outputs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/content|output-commits/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}|failure|start)$" {
    if ($request_method !~ "^(?:POST)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Conversation execution
location ~ "^/internal/agent/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/runs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/conversation/(?:inputs(?:-v3|/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/content)?|lease(?:/renew)?|provider-start(?:-controlled-image(?:-v3)?)?|failure|(?:output|result)-commits/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}|outputs/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/content)$" {
    if ($request_method !~ "^(?:POST)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Work-item result receipt
location ~ "^/internal/agent/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/work-items/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/reassignments/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/commands/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/result-commit$" {
    if ($request_method !~ "^(?:GET|POST)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

# Work-item lease read
location ~ "^/internal/agent/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/work-items/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/reassignments/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/commands/[A-Za-z0-9][A-Za-z0-9._:-]{0,99}/lease$" {
    if ($request_method !~ "^(?:GET)$") { return 405; }
    include /home/isp/apps/nginx/conf/snippets/cyf-runtime-native-proxy.conf;
}

