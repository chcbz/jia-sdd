model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[features]
multi_agent = true

[agents]
# Capacity only; CYF orchestration currently activates one task at a time.
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 3600

[agents.architect]
description = "Read-only architecture, state-machine, transaction, and migration designer for high-risk CYF work."
config_file = "agents/architect.toml"
nickname_candidates = ["Archimedes", "Lagrange", "Noether"]

[agents.critical_worker]
description = "Primary writer for P0 identity, ACL, concurrency, transaction, and migration implementation."
config_file = "agents/critical-worker.toml"
nickname_candidates = ["Turing", "Shannon", "Knuth"]

[agents.balanced_worker]
description = "Balanced implementation agent for normal Java, Vue, API, mapper, and integration tasks."
config_file = "agents/balanced-worker.toml"
nickname_candidates = ["Curie", "Faraday", "Hopper"]

[agents.routine_worker]
description = "Low-cost worker for bounded DTO, tests, fixtures, documentation, and repetitive edits."
config_file = "agents/routine-worker.toml"
nickname_candidates = ["Pascal", "Euler", "Gauss"]

[agents.adversarial_reviewer]
description = "Independent cross-model reviewer for security, transaction, concurrency, migration, and data-loss attacks."
config_file = "agents/adversarial-reviewer.toml"
nickname_candidates = ["Popper", "Hume", "Kant"]

[agents.explorer]
description = "Read-only repository explorer for dependency, call-chain, conflict, and integration analysis."
config_file = "agents/explorer.toml"
nickname_candidates = ["Darwin", "Linnaeus", "Vesalius"]

[agents.fast_query]
description = "Very fast read-only agent for narrow lookups, summaries, and bounded fact extraction."
config_file = "agents/fast-query.toml"
nickname_candidates = ["Euclid", "Kepler", "Bohr"]

[agents.test_runner]
description = "Verification-only agent that runs serialized builds, tests, probes, and reports evidence without source edits."
config_file = "agents/test-runner.toml"
nickname_candidates = ["Feynman", "Tesla", "Galileo"]

[agents.release_guard]
description = "Read-only final integration and production-release gatekeeper."
config_file = "agents/release-guard.toml"
nickname_candidates = ["Socrates", "Confucius", "Locke"]

[agents.vision_reviewer]
description = "Independent GPT multimodal visual-quality reviewer for Juyi Hall screenshots, occlusion semantics, and visual regressions."
config_file = "agents/vision-reviewer.toml"
nickname_candidates = ["ShenKuoVision", "GuKaizhi", "ZhangZeduan"]

[agents.sol_reviewer]
description = "GPT-5.6 Sol High independent read-only reviewer for bounded GPT-written CYF tasks."
config_file = "agents/sol-reviewer.toml"
nickname_candidates = ["Leibniz", "Godel", "Raman"]

