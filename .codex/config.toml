model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[features]
multi_agent = true

[agents]
# Capacity only; CYF orchestration currently activates one task at a time.
max_threads = 5
max_depth = 1
job_max_runtime_seconds = 3600

[agents.architect]
description = "Read-only architecture, state-machine, transaction, and migration designer for high-risk CYF work."
config_file = "agents/architect.toml"
nickname_candidates = ["Archimedes", "Lagrange", "Noether"]

[agents.critical_worker]
description = "GPT-6.1 Sol High writer for P0 identity, ACL, concurrency, transaction, migration, and snapshot consistency."
config_file = "agents/critical-worker.toml"
nickname_candidates = ["Turing", "Shannon", "Knuth"]

[agents.balanced_worker]
description = "Terra Medium writer for normal Java, Vue, API, mapper, feature-flag, and integration tasks."
config_file = "agents/balanced-worker.toml"
nickname_candidates = ["Curie", "Faraday", "Hopper"]

[agents.spark_worker]
description = "GPT-6 Luna Medium writer for contract-frozen packetized Java/Vue implementation and focused tests."
config_file = "agents/spark-worker.toml"
nickname_candidates = ["McCarthy", "Dijkstra", "Kay"]

[agents.routine_worker]
description = "Luna Medium writer for bounded accessibility, DTO, fixture, test, documentation, and mechanical edits."
config_file = "agents/routine-worker.toml"
nickname_candidates = ["Pascal", "Euler", "Gauss"]

[agents.adversarial_reviewer]
description = "GPT-6.1 Sol High independent adversarial reviewer for security, transaction, concurrency, migration, and data-loss attacks."
config_file = "agents/adversarial-reviewer.toml"
nickname_candidates = ["Popper", "Hume", "Kant"]

[agents.explorer]
description = "Terra Medium read-only repository explorer for dependency, call-chain, conflict, and integration analysis."
